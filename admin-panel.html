<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Smart Dustbin</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: Arial, sans-serif;
            background: #1a1a2e;
            color: white;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: auto;
        }

        .header {
            background: rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 { font-size: 24px; }

        .logout-btn {
            background: #f44336;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }

        .info-bar {
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
            padding: 15px 25px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
        }

        .control-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .control-card {
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
        }

        .control-card h3 {
            margin-bottom: 15px;
            font-size: 16px;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            color: white;
            transition: transform 0.2s;
        }

        .btn:hover { transform: scale(1.05); }
        .btn:active { transform: scale(0.95); }

        .btn-open { background: #4CAF50; }
        .btn-close { background: #f44336; }
        .btn-dry { background: #FF9800; }
        .btn-wet { background: #2196F3; }
        .btn-auto { background: #9C27B0; }
        .btn-manual { background: #607D8B; }
        .btn-test { background: #00BCD4; }
        .btn-reset { background: #FF5722; }

        .log-section {
            background: rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 25px;
            max-height: 400px;
            overflow-y: auto;
        }

        .log-entry {
            padding: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            display: flex;
            justify-content: space-between;
            font-size: 14px;
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 25px;
            border-radius: 10px;
            color: white;
            font-weight: bold;
            z-index: 9999;
            animation: slideIn 0.3s;
        }

        @keyframes slideIn {
            from { transform: translateX(100%); }
            to { transform: translateX(0); }
        }

        .success { background: #4CAF50; }
        .error { background: #f44336; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div>
                <h1>⚙️ Admin Control Panel</h1>
                <p>Welcome, <span id="adminName">Admin</span></p>
            </div>
            <button class="logout-btn" onclick="logout()">🚪 Logout</button>
        </div>

        <div class="info-bar">
            <span>Device: <strong id="deviceIP">---</strong></span>
            <span>Status: <span id="connectionStatus">Checking...</span></span>
            <span>Login: <span id="loginTime">---</span></span>
        </div>

        <div class="control-grid">
            <div class="control-card">
                <h3>🔧 Lid Control</h3>
                <button class="btn btn-open" onclick="send('open')">Open Lid</button>
                <button class="btn btn-close" onclick="send('close')">Close Lid</button>
            </div>

            <div class="control-card">
                <h3>🗑️ Waste Sorting</h3>
                <button class="btn btn-dry" onclick="send('dry')">Dry Waste</button>
                <button class="btn btn-wet" onclick="send('wet')">Wet Waste</button>
            </div>

            <div class="control-card">
                <h3>🤖 Mode</h3>
                <button class="btn btn-auto" onclick="send('auto')">Auto Mode</button>
                <button class="btn btn-manual" onclick="send('manual')">Manual Mode</button>
            </div>

            <div class="control-card">
                <h3>🔧 Tools</h3>
                <button class="btn btn-test" onclick="send('test')">Test Servos</button>
                <button class="btn btn-reset" onclick="resetCounter()">Reset Counter</button>
            </div>
        </div>

        <div class="log-section">
            <h3 style="margin-bottom: 15px;">📜 Activity Log</h3>
            <div id="logContainer">
                <div class="log-entry">No activity yet</div>
            </div>
        </div>
    </div>

    <script>
        // Check login
        if (!sessionStorage.getItem('adminLoggedIn')) {
            window.location.href = 'admin.html';
        }

        var deviceIP = sessionStorage.getItem('deviceIP') || '192.168.1.100';
        var adminUser = sessionStorage.getItem('adminUser') || 'Admin';
        
        document.getElementById('adminName').textContent = adminUser;
        document.getElementById('deviceIP').textContent = deviceIP;
        document.getElementById('loginTime').textContent = new Date(sessionStorage.getItem('loginTime')).toLocaleTimeString();

        var activityLog = [];

        function send(cmd) {
            fetch('http://' + deviceIP + '/' + cmd)
                .then(function(response) {
                    if (response.ok) {
                        addLog('Command: ' + cmd.toUpperCase(), 'Success');
                        showNotification('Command sent: ' + cmd, 'success');
                        document.getElementById('connectionStatus').textContent = 'Connected';
                    } else {
                        addLog('Command: ' + cmd.toUpperCase(), 'Failed');
                        showNotification('Failed to send command', 'error');
                    }
                })
                .catch(function(error) {
                    addLog('Command: ' + cmd.toUpperCase(), 'Error');
                    showNotification('Device not connected!', 'error');
                    document.getElementById('connectionStatus').textContent = 'Disconnected';
                });
        }

        function resetCounter() {
            if (confirm('Reset waste counter to zero?')) {
                addLog('Counter Reset', 'Manual');
                showNotification('Counter reset (visual only)', 'success');
            }
        }

        function addLog(action, status) {
            activityLog.unshift({
                time: new Date().toLocaleTimeString(),
                action: action,
                status: status
            });

            if (activityLog.length > 20) activityLog.pop();

            var logDiv = document.getElementById('logContainer');
            logDiv.innerHTML = activityLog.map(function(entry) {
                return '<div class="log-entry">' +
                    '<span>' + entry.time + '</span>' +
                    '<span>' + entry.action + '</span>' +
                    '<span>' + entry.status + '</span>' +
                    '</div>';
            }).join('');
        }

        function showNotification(msg, type) {
            var notif = document.createElement('div');
            notif.className = 'notification ' + type;
            notif.textContent = msg;
            document.body.appendChild(notif);
            setTimeout(function() { notif.remove(); }, 3000);
        }

        function logout() {
            if (confirm('Are you sure you want to logout?')) {
                sessionStorage.clear();
                window.location.href = 'admin.html';
            }
        }

        // Test connection
        fetch('http://' + deviceIP + '/data')
            .then(function(r) { return r.json(); })
            .then(function() {
                document.getElementById('connectionStatus').textContent = 'Connected ✅';
            })
            .catch(function() {
                document.getElementById('connectionStatus').textContent = 'Not Connected ❌';
            });
    </script>
</body>
</html>
